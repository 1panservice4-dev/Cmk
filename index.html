```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Maker 1차 테스트</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    padding:18px;
    text-align:center;
    background:#191919;
    border-bottom:1px solid #333;
}

header h1{
    margin:0;
    font-size:24px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:380px 1fr;
    gap:30px;
}

.editor{
    background:#1d1d1d;
    padding:20px;
    border-radius:15px;
}

.editor h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    color:#ccc;
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    border:none;
    border-radius:8px;
    background:#303030;
    color:white;
    font-size:15px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#e0a72b;
    color:#111;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.1);
}

.preview{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
}

/* CARD */

.card{
    width:360px;
    height:520px;
    padding:12px;
    border-radius:8px;
    background:linear-gradient(135deg,#d6a83d,#8c5c13);
    box-shadow:0 10px 35px #000;
    position:relative;
    color:#111;
}

.card.magic{
    background:linear-gradient(135deg,#43b5a5,#12645b);
}

.card.trap{
    background:linear-gradient(135deg,#c0529a,#702050);
}

.card-inner{
    width:100%;
    height:100%;
    background:#d9b96b;
    padding:7px;
    border-radius:3px;
    border:3px solid #3d260c;
}

.magic .card-inner{
    background:#65bcb0;
}

.trap .card-inner{
    background:#b9659c;
}

.card-name{
    height:43px;
    background:#d9c58b;
    border:2px solid #39270d;
    display:flex;
    align-items:center;
    padding:5px 9px;
    font-size:21px;
    font-weight:bold;
    overflow:hidden;
    white-space:nowrap;
}

.magic .card-name,
.trap .card-name{
    background:#9bd0c8;
}

.attribute{
    float:right;
    font-size:13px;
    margin-left:auto;
}

.art{
    margin-top:7px;
    width:100%;
    height:245px;
    background:#777;
    border:4px solid #3b270e;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.art img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.art-placeholder{
    color:#ddd;
    text-align:center;
    font-size:14px;
}

.level{
    text-align:right;
    height:28px;
    padding-top:3px;
    font-size:18px;
    font-weight:bold;
}

.card-info{
    margin-top:4px;
    background:#e7d6a1;
    border:2px solid #3d260c;
    height:145px;
    padding:7px;
}

.magic .card-info,
.trap .card-info{
    background:#b9ded8;
}

.type{
    font-weight:bold;
    border-bottom:1px solid #555;
    padding-bottom:3px;
}

.effect{
    margin-top:5px;
    font-size:13px;
    line-height:1.3;
    white-space:pre-wrap;
    height:93px;
    overflow:hidden;
}

.stats{
    margin-top:5px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
    font-size:15px;
    font-weight:bold;
}

.footer{
    margin-top:4px;
    text-align:right;
    font-size:8px;
}

@media(max-width:800px){
    .container{
        grid-template-columns:1fr;
    }

    .editor{
        order:2;
    }

    .preview{
        order:1;
    }
}

@media(max-width:420px){
    .card{
        transform:scale(.82);
        transform-origin:top center;
        margin-bottom:-90px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🃏 CARD MAKER — 1차 테스트</h1>
</header>

<div class="container">

<div class="editor">

<h2>카드 설정</h2>

<label>카드 종류</label>
<select id="cardType">
    <option value="monster">몬스터</option>
    <option value="magic">마법</option>
    <option value="trap">함정</option>
</select>

<label>카드 이름</label>
<input id="cardName" value="테스트 몬스터">

<label>속성</label>
<select id="attribute">
    <option>빛</option>
    <option>어둠</option>
    <option>화염</option>
    <option>물</option>
    <option>땅</option>
    <option>바람</option>
    <option>신</option>
</select>

<label>레벨</label>
<input id="level" type="number" min="0" max="12" value="4">

<label>종족</label>
<input id="race" value="마법사족">

<label>ATK</label>
<input id="atk" value="1800">

<label>DEF</label>
<input id="def" value="1500">

<label>카드 이미지</label>
<input id="imageInput" type="file" accept="image/*">

<label>카드 효과 / 설명</label>
<textarea id="effect">① 이 카드가 필드 위에 존재하는 한, 특별한 효과를 얻는다.
② 이 카드는 1턴에 1번 사용할 수 있다.</textarea>

<button id="downloadBtn">
    📥 PNG로 저장
</button>

<button id="resetBtn">
    🔄 초기화
</button>

</div>


<div class="preview">

<div id="card" class="card">

<div class="card-inner">

<div class="card-name">
    <span id="previewName">테스트 몬스터</span>
    <span class="attribute" id="previewAttribute">빛</span>
</div>

<div class="level" id="previewLevel">
    ⭐⭐⭐⭐
</div>

<div class="art">
    <img id="previewImage">
    <div class="art-placeholder" id="placeholder">
        카드 이미지를<br>업로드하세요
    </div>
</div>

<div class="card-info">

<div class="type" id="previewType">
    [마법사족 / 효과]
</div>

<div class="effect" id="previewEffect">
    ① 이 카드가 필드 위에 존재하는 한, 특별한 효과를 얻는다.
    ② 이 카드는 1턴에 1번 사용할 수 있다.
</div>

<div class="stats">
    <span>ATK/<span id="previewAtk">1800</span></span>
    <span>DEF/<span id="previewDef">1500</span></span>
</div>

</div>

<div class="footer">
    CARD MAKER TEST
</div>

</div>

</div>

</div>

</div>


<script>

const card = document.getElementById("card");

const cardType = document.getElementById("cardType");
const cardName = document.getElementById("cardName");
const attribute = document.getElementById("attribute");
const level = document.getElementById("level");
const race = document.getElementById("race");
const atk = document.getElementById("atk");
const def = document.getElementById("def");
const effect = document.getElementById("effect");
const imageInput = document.getElementById("imageInput");

const previewName = document.getElementById("previewName");
const previewAttribute = document.getElementById("previewAttribute");
const previewLevel = document.getElementById("previewLevel");
const previewType = document.getElementById("previewType");
const previewEffect = document.getElementById("previewEffect");
const previewAtk = document.getElementById("previewAtk");
const previewDef = document.getElementById("previewDef");

const previewImage = document.getElementById("previewImage");
const placeholder = document.getElementById("placeholder");

function updateCard(){

    previewName.textContent =
        cardName.value || "이름 없음";

    previewAttribute.textContent =
        attribute.value;

    const lv = Number(level.value) || 0;

    if(cardType.value === "monster"){
        previewLevel.textContent =
            "⭐".repeat(Math.min(lv,12));
    }else{
        previewLevel.textContent = "";
    }

    if(cardType.value === "monster"){

        previewType.textContent =
            `[${race.value || "종족"} / 효과]`;

        previewAtk.textContent =
            atk.value || "0";

        previewDef.textContent =
            def.value || "0";

    }else if(cardType.value === "magic"){

        previewType.textContent =
            "[마법 카드]";

        previewAtk.textContent = "-";
        previewDef.textContent = "-";

    }else{

        previewType.textContent =
            "[함정 카드]";

        previewAtk.textContent = "-";
        previewDef.textContent = "-";
    }

    previewEffect.textContent =
        effect.value || "";

    card.classList.remove("magic","trap");

    if(cardType.value === "magic"){
        card.classList.add("magic");
    }

    if(cardType.value === "trap"){
        card.classList.add("trap");
    }
}


[
    cardType,
    cardName,
    attribute,
    level,
    race,
    atk,
    def,
    effect
].forEach(el=>{
    el.addEventListener("input",updateCard);
    el.addEventListener("change",updateCard);
});


imageInput.addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        previewImage.src = e.target.result;
        previewImage.style.display = "block";
        placeholder.style.display = "none";

    };

    reader.readAsDataURL(file);
});


document.getElementById("resetBtn").addEventListener("click",function(){

    cardType.value = "monster";
    cardName.value = "테스트 몬스터";
    attribute.value = "빛";
    level.value = 4;
    race.value = "마법사족";
    atk.value = "1800";
    def.value = "1500";

    effect.value =
`① 이 카드가 필드 위에 존재하는 한, 특별한 효과를 얻는다.
② 이 카드는 1턴에 1번 사용할 수 있다.`;

    imageInput.value = "";

    previewImage.src = "";
    previewImage.style.display = "none";
    placeholder.style.display = "block";

    updateCard();
});


document.getElementById("downloadBtn").addEventListener("click",async function(){

    const button = this;

    button.textContent = "⏳ 저장 중...";

    try{

        const canvas = await html2canvas(card,{
            scale:3,
            useCORS:true,
            backgroundColor:null
        });

        const link = document.createElement("a");

        link.download =
            (cardName.value || "card") + ".png";

        link.href =
            canvas.toDataURL("image/png");

        link.click();

    }catch(error){

        console.error(error);
        alert("PNG 저장에 실패했습니다.");

    }

    button.textContent = "📥 PNG로 저장";

});


updateCard();

</script>

</body>
</html>
```
